<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>schedule project</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            min-height: 100vh;
            margin: 0;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 16px;
            background-color: #f2f2f2;
        }
        img {
            display: block;
            width: min(80vw, 900px);
            max-height: 80vh;
            height: auto;
            object-fit: contain;
            object-position: center;
            border-radius: 8px;
        }
    </style>
</head>
<body>
    <img src="pakyu.jpg" alt="Pakyu">
    <audio src="tite.mp4" loop></audio>

    <script>
        document.addEventListener('click', function () {
            const audio = document.querySelector('audio');
            audio.play();
        }, { once: true });
    </script>
</body>
</html>
